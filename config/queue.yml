default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # Keep deliveries concurrency low: parallel MX to one receiver invites throttling;
    # not 1, so a hung recipient can't block every other delivery.
    - queues: [ "deliveries" ]
      threads: <%= Integer(ENV.fetch("DELIVERY_JOB_CONCURRENCY", 2)) %>
      processes: 1
      polling_interval: 0.1
    - queues: [ "webhooks" ]
      threads: 5
      processes: <%= Integer(ENV.fetch("WEBHOOK_JOB_CONCURRENCY", 1)) %>
      polling_interval: 0.1
    - queues: [ "forwarding" ]
      threads: 5
      processes: <%= Integer(ENV.fetch("FORWARDING_JOB_CONCURRENCY", 1)) %>
      polling_interval: 0.1
    - queues: [ "default", "solid_queue_recurring" ]
      threads: 3
      processes: 1
      polling_interval: 0.25

development: *default
test: *default
production: *default
staging: *default
